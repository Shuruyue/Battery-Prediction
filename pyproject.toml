[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ups-battery-prediction"
version = "0.1.0"
description = "How long a UPS battery lasts and whether it can burn: formula, simulation and machine learning scored against one reference, inside and outside their range"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuruyue" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
reference = ["pybamm>=25.1"]

[tool.setuptools]
packages = ["ups_battery_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# I is the cell current, l and O are not used
ignore = ["E741"]
