name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows catches encoding problems Linux cannot (non-UTF-8 default file/console encoding)
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests, the page's data against the results (pytest)
        run: pytest -q
      - name: Validation table (fails the job on any FAIL), main results, figures
        run: |
          python scripts/validate.py --markdown
          python scripts/summary.py
          python scripts/make_figures.py
      - name: VALIDATION.md is in sync with the code
        if: runner.os == 'Linux'
        run: git diff --exit-code VALIDATION.md

  parameters:
    # every parameter function against PyBaMM's ORegan2022 set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with PyBaMM
        run: pip install -e ".[dev,reference]"
      - name: Parameters against PyBaMM
        run: pytest -q tests/test_params.py
